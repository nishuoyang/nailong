services:
  # ── 反向代理 + 自动 HTTPS ──
  # 80/443 由 Caddy 独占；应用不再对外发布端口，只在 compose 网络内以 server:3000 可达。
  caddy:
    # 2-alpine 是主版本固定 tag（当前解析为 v2.11.4）。不用 latest：latest 是滚动 tag，
    # 可能在不经意间跨大版本升级导致行为变化。
    image: caddy:2-alpine
    container_name: nailong-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # 证书与 ACME 账户必须持久化，否则重建容器会重新签发（可能触发 LE 速率限制）
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: nailong-server
    restart: unless-stopped
    # 不再发布 80:3000 —— 由 Caddy 在前面终止 TLS 并反代到 server:3000。
    # 需要直连调试时用 docker compose exec，不要把 3000 暴露到公网。
    expose:
      - "3000"
    volumes:
      - sqlite_data:/app/data
      - ./server/.env:/app/.env:ro
      # ── 应用日志落盘（2026-09-11）──
      # 必须是**宿主机 bind mount**，不能只靠 stdout：
      # `docker logs` 读的是当前容器的 json-file，而 `docker compose up -d`
      # （即每次发布）都会换一个新容器，旧容器的日志文件随之被删除 ——
      # 两次 502 的现场和「查不清是谁删的图片」都是这么丢的。
      # 用 bind mount 而不是命名卷，是为了在宿主机上直接 `tail -f logs/app.log`，
      # 不必先 docker exec 或去 /var/lib/docker/volumes 里翻。
      # 目录型挂载没有「单文件 bind mount 换 inode」那个坑（见 docs/ 坑 25）。
      - ./logs:/app/logs
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/data.db
      # 应用日志（AppFileLogger + entrypoint.sh 共用；见 server/src/common/logging/）
      # 上限 = LOG_MAX_BYTES × LOG_MAX_FILES = 10 MiB × 5 = 50 MiB，滚动不掉。
      - LOG_DIR=/app/logs
      - LOG_FILE=app.log
      - LOG_MAX_BYTES=10485760
      - LOG_MAX_FILES=5
      # 站点域名/IP（加了 http://nailonghub.top：HTTP 会在 Caddy 层 301，此处仅作兜底）
      - CORS_ORIGINS=http://47.103.38.58,http://nailonghub.top,https://nailonghub.top
      # 静态文件
      - CLIENT_DIST_PATH=/app/client-dist
      # MinIO（容器内互联）
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=nailong-images
      # MinIO 公网 URL（同源代理）
      - MINIO_PUBLIC_URL=/minio

  redis:
    image: redis:7-alpine
    container_name: nailong-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: nailong-minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data

volumes:
  sqlite_data:
  redis_data:
  minio_data:
  # Caddy 的证书与 ACME 账户
  caddy_data:
  caddy_config:
