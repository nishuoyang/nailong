version: '3.8'

services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: nailong-server
    restart: unless-stopped
    ports:
      - "80:3000"
    volumes:
      - sqlite_data:/app/data
      - ./server/.env:/app/.env:ro
      # 客户端构建产物（需先 cd client && npm run build）
      - ./client/dist:/app/client-dist:ro
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/data.db
      # 静态文件
      - CLIENT_DIST_PATH=/app/client-dist
      # MinIO（容器内互联）
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=nailong-images
      # MinIO 公网 URL（同源代理）
      - MINIO_PUBLIC_URL=/minio

  redis:
    image: redis:7-alpine
    container_name: nailong-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: nailong-minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data

volumes:
  sqlite_data:
  redis_data:
  minio_data:
